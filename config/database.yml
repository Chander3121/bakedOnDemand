
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: bakes_on_demand_development
  username: postgres
  password: postgres
  host:     localhost


test:
  <<: *default
  database: bakes_on_demand_test
  username: postgres
  password: postgres
  host:     localhost

production:
  primary: &primary_production
    <<: *default
    database: bakes_on_demand_production
    username: bakes_on_demand
    password: <%= ENV["BAKES_ON_DEMAND_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: bakes_on_demand_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: bakes_on_demand_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: bakes_on_demand_production_cable
    migrations_paths: db/cable_migrate
